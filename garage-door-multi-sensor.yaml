esphome:
  name: garage-door-multi-sensor
  friendly_name: Garage door multi sensor

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password2
  ap:
    ssid: "Garage-multi-sensor-fallback"

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 
    minutes: 10

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: WARN
  baud_rate: 0

debug:

i2c:
  - id: bus_a
    sda: 8
    scl: 9
    scan: true
    frequency: 100kHz

as5600:
  - id: as5600_hub
    i2c_id: bus_a
    address: 0x36

text_sensor:
  - platform: debug
  - platform: wifi_info
    ip_address:
      name: "Garage door multi sensor IP address"
    ssid:
      name: "Garage door multi sensor connected SSID"
  - platform: homeassistant
    entity_id: input_select.garage_motor_last_direction
    id: motor_direction

button:
  - platform: restart
    name: "Restart garage door multi sensor"

globals:
  - id: total_steps
    type: float
    restore_value: no
    initial_value: '0'
  - id: peak_steps
    type: float
    initial_value: '24500.0'
  - id: manual_override
    type: bool
    initial_value: 'false'
  - id: ignore_open_reed
    type: bool
    initial_value: 'false'
  - id: coasting_lock
    type: bool
    initial_value: 'false'
    
sensor:
  # WiFi Signal & System Sensors
  - platform: wifi_signal
    name: "Garage door multi sensor WiFi Signal"
    update_interval: 60s
  - platform: internal_temperature
    name: "Garage door multi sensor internal temperature"
    update_interval: 60s
  - platform: uptime
    name: "Garage door multi sensor Uptime"
    update_interval: 60s

  # AS5600 RAW DATA to Home Assistant
  - platform: as5600
    name: "AS5600 Raw Value"
    as5600_id: as5600_hub
    update_interval: 0.1s
    id: rotary_raw

  - platform: template
    name: "Shaft Steps"
    id: shaft_steps
    unit_of_measurement: "steps"
    accuracy_decimals: 0
    update_interval: 0.1s
    icon: "mdi:counter"
    lambda: |-
      // 1. HARDWARE LOCKS
      // Force 0 if closed reed is active
      if (id(door_closed_reed).state) {
        id(total_steps) = 0.0f;
        return 0.0f;
      }
      
      // Force Peak only if not ignoring (not just started closing)
      if (id(door_open_reed).state && !id(ignore_open_reed)) {
        id(total_steps) = 24500.0f;
        return 24500.0f;
      }

      static float last_raw = -1.0;
      float current_raw = id(rotary_raw).state;
      
      if (std::isnan(current_raw)) return id(total_steps);
      
      if (last_raw == -1.0) { 
        last_raw = current_raw; 
        return id(total_steps); 
      }

      // --- COASTING GUARD ---
      // If we just hit stop, ignore the "wobble" and inertia for 1s
      if (id(coasting_lock)) {
        last_raw = current_raw; 
        return id(total_steps);
      }

      float diff = current_raw - last_raw;
      
      // Handle 12-bit rollover (0-4095)
      if (diff > 2048.0f) diff -= 4096.0f;
      else if (diff < -2048.0f) diff += 4096.0f;

      // Jitter filter (10.0f handles your midway noise)
      if (std::abs(diff) < 10.0f) return id(total_steps);

      // --- 2. SMART ZONE MATH (The Fix) ---
      // 0 - 22000: Trust physical magnet rotation.
      // 22000+: Force directionality to prevent "backward" drift at the curve.
      bool in_danger_zone = (id(total_steps) > 22000.0f);

      if (id(garage_door_cover).current_operation == COVER_OPERATION_OPENING) {
        // In upper zone, use abs(diff) because shaft spins "backwards" relative to door.
        id(total_steps) += in_danger_zone ? std::abs(diff) : -diff; 
      } 
      else if (id(garage_door_cover).current_operation == COVER_OPERATION_CLOSING) {
        // In upper zone, force subtraction regardless of raw spin direction.
        id(total_steps) -= in_danger_zone ? std::abs(diff) : diff;
      } 
      else {
        // IDLE: Magnet tracking (Inverted for your magnet orientation)
        id(total_steps) -= diff; 
      }

      last_raw = current_raw;
      return id(total_steps);

    on_value:
      then:
        - lambda: |-
            // 3. MANUAL OVERRIDE CHECK
            if (id(manual_override)) return;

            static float last_pos = 0;
            static int idle_counter = 0;
            float current_pos = x;
            float speed = current_pos - last_pos;
            last_pos = current_pos;

            // Speed threshold for state publishing
            if (std::abs(speed) >= 12.0f) {
                idle_counter = 0; 
                if (!id(door_closed_reed).state && !id(door_open_reed).state) {
                    auto new_op = (speed > 0) ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
                    if (id(garage_door_cover).current_operation != new_op) {
                        id(garage_door_cover).current_operation = new_op;
                        id(garage_door_cover).publish_state();
                    }
                }
            } else {
                idle_counter++;
                // Stop operation if no significant movement for 0.5s
                if (idle_counter > 5 && id(garage_door_cover).current_operation != COVER_OPERATION_IDLE) {
                    id(garage_door_cover).current_operation = COVER_OPERATION_IDLE;
                    id(garage_door_cover).publish_state();
                }
            }
            
binary_sensor:
  # 1. CLOSED REED (Imported via HA)
  - platform: homeassistant
    entity_id: binary_sensor.garage_door_input
    id: door_closed_reed
    filters:
      - delayed_on: 1s 
    on_state:
      then:
        - if:
            condition: { lambda: 'return x;' }
            then:
              - lambda: |-
                  id(total_steps) = 0.0f;
                  id(garage_door_cover).position = 0.0f;
                  id(garage_door_cover).current_operation = COVER_OPERATION_IDLE;
                  id(garage_door_cover).publish_state();
                  id(shaft_steps).publish_state(0);

# 2. OPEN REED (GPIO 2)
  - platform: gpio
    name: "Garage Door Open Status"
    id: door_open_reed
    device_class: opening
    pin:
      number: 2
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - script.execute: sync_open_position

  # 3. IR BEAM (GPIO 4)
  - platform: gpio
    name: "Garage IR Beam Status"
    id: ir_beam_break
    device_class: safety
    pin:
      number: 4
      mode: INPUT_PULLUP

script:
  - id: drive_to_position
    mode: restart
    parameters:
      target_pos: float
    then:
      - lambda: |-
          float max_peak = 24500.0f; // Use your observed linear max steps
          float target_steps = target_pos * max_peak;
          float current_steps = id(shaft_steps).state;
          
          // 1. Check if we are already there (2% tolerance)
          if (std::abs(current_steps - target_steps) < (max_peak * 0.02f)) return;

          // 2. Decide direction and trigger call
          auto call = id(garage_door_cover).make_call();
          if (target_steps > current_steps) {
            call.set_command_open();
          } else {
            call.set_command_close();
          }
          call.perform();
      
      - wait_until:
          condition:
            lambda: |-
              float max_peak = 24500.0f;
              float target_steps = target_pos * max_peak;
              float current_steps = id(shaft_steps).state;
              float offset = max_peak * 0.03f; // 3% lead time for braking

              if (id(garage_door_cover).current_operation == COVER_OPERATION_OPENING) {
                return (current_steps >= (target_steps - offset));
              } else if (id(garage_door_cover).current_operation == COVER_OPERATION_CLOSING) {
                return (current_steps <= (target_steps + offset));
              }
              return false;
          timeout: 25s

      - cover.stop: garage_door_cover
  
  - id: sync_open_position
    mode: single  # This ignores new triggers while the delay is active
    then:
      - if:
          condition:
            lambda: 'return !id(ignore_open_reed);'
          then:
            - lambda: |-
                id(total_steps) = 24500.0f; 
                id(garage_door_cover).position = 1.0f;
                id(garage_door_cover).current_operation = COVER_OPERATION_IDLE;
                id(garage_door_cover).publish_state();
                id(shaft_steps).publish_state(24500.0f);
            - logger.log: "Open Reed Sync successful. Locking out for 2s..."
            - delay: 2s

cover:
  - platform: template
    name: "Garage Door"
    id: garage_door_cover
    device_class: garage
    has_position: true

    lambda: |-
      if (id(door_closed_reed).state) return 0.0f;
      if (id(door_open_reed).state) return 1.0f;
      float max_steps = 24500.0f; 
      return clamp(id(shaft_steps).state / max_steps, 0.0f, 1.0f);

    position_action:
      - script.execute:
          id: drive_to_position
          target_pos: !lambda "return pos;"

    open_action:
      - if:
          condition: { lambda: 'return id(garage_door_cover).position < 0.99f;' }
          then:
            - lambda: |-
                id(manual_override) = true;
                id(garage_door_cover).current_operation = COVER_OPERATION_OPENING;
                id(garage_door_cover).publish_state();
            - if:
                condition: { lambda: 'return id(motor_direction).state == "opening";' }
                then: { homeassistant.service: {service: script.garage_triple_pulse} }
                else: { homeassistant.service: {service: switch.turn_on, data: {entity_id: "switch.garage_door"}} }
            - delay: 3s
            - lambda: 'id(manual_override) = false;'

    close_action:
      - if:
          condition: { lambda: 'return id(garage_door_cover).position > 0.01f;' }
          then:
            - lambda: |-
                id(manual_override) = true;
                id(ignore_open_reed) = true; 
                id(garage_door_cover).current_operation = COVER_OPERATION_CLOSING;
                id(garage_door_cover).publish_state();
            - if:
                condition:
                  # Force single pulse if at the top to prevent 'move up then down' jitter
                  lambda: 'return id(door_open_reed).state;'
                then:
                  - homeassistant.service: {service: switch.turn_on, data: {entity_id: "switch.garage_door"}}
                else:
                  - if:
                      condition: { lambda: 'return id(motor_direction).state == "closing";' }
                      then: { homeassistant.service: {service: script.garage_triple_pulse} }
                      else: { homeassistant.service: {service: switch.turn_on, data: {entity_id: "switch.garage_door"}} }
            - delay: 3s
            - lambda: |-
                id(manual_override) = false;
                id(ignore_open_reed) = false;

    stop_action:
      - if:
          condition: { lambda: 'return id(garage_door_cover).current_operation != COVER_OPERATION_IDLE;' }
          then:
            - lambda: |-
                id(manual_override) = true;
                id(coasting_lock) = true; // LOCK THE SENSOR
                id(garage_door_cover).current_operation = COVER_OPERATION_IDLE;
                id(garage_door_cover).publish_state();
            - homeassistant.service: { service: switch.turn_on, data: { entity_id: "switch.garage_door" } }
            - delay: 2s
            - lambda: |-
                id(manual_override) = false;
                id(coasting_lock) = false; // RELEASE THE SENSOR

captive_portal:
